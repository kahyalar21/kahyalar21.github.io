name: Günlük Portal Otomatik Derleme

on:
  schedule:
    # Her gün TSİ 00:00 ve 06:00 (UTC 21:00 ve 03:00)
    - cron: '0 21,3 * * *'
  workflow_dispatch: # İsteğe bağlı manuel tetikleme

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests

      - name: Siteyi Otomatik Derle
        run: python build.py

      - name: Değişiklikleri GitHub Pages'e Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M')" && git push)
